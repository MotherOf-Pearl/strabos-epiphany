<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Strabo's Epiphany</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; font-family: Georgia, serif; background: #1a1511; color: #e8dfd3; }
  #app { display: grid; grid-template-rows: 1fr auto; height: 100vh; }
  #map { width: 100%; height: 100%; }
  #timeline {
    background: #221c17;
    border-top: 1px solid #3a2f26;
    padding: 14px 20px 18px;
  }
  #timeline-label {
    font-size: 20px;
    letter-spacing: 0.05em;
    margin-bottom: 10px;
    display: flex;
    align-items: baseline;
    gap: 14px;
  }
  #year-display { color: #d4a574; font-weight: bold; font-size: 24px; }
  #window-display { color: #8a7560; font-size: 13px; }
  input[type=range] {
    width: 100%;
    -webkit-appearance: none;
    appearance: none;
    height: 6px;
    background: #3a2f26;
    border-radius: 3px;
    outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #d4a574;
    cursor: pointer;
  }
  input[type=range]::-moz-range-thumb {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #d4a574;
    cursor: pointer;
    border: none;
  }
  .ticks {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: #6d5e4e;
    margin-top: 6px;
    letter-spacing: 0.05em;
  }
  .popup-title { font-weight: bold; font-size: 15px; margin-bottom: 4px; }
  .popup-date { color: #8a4522; font-size: 12px; margin-bottom: 6px; }
  .popup-body { font-size: 13px; line-height: 1.4; }
  .maplibregl-popup-content { background: #f3ead9; color: #1a1511; border-radius: 2px; padding: 12px 14px; max-width: 280px; }
  .maplibregl-popup-tip { border-top-color: #f3ead9 !important; border-bottom-color: #f3ead9 !important; }
</style>
</head>
<body>
<div id="app">
  <div id="map"></div>
  <div id="timeline">
    <div id="timeline-label">
      <span>Year</span>
      <span id="year-display">0 CE</span>
      <span id="window-display">showing events within ±100 years</span>
    </div>
    <input type="range" id="year-slider" min="-3000" max="2026" step="10" value="0" />
    <div class="ticks">
      <span>3000 BCE</span><span>1500 BCE</span><span>0</span><span>1000 CE</span><span>2026</span>
    </div>
  </div>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="/app.js"></script>
</body>
</html>
